# ClawScan's built-in clawhub profile at CLAWSCAN_COMMIT (clawhub-scan.yml),
# with one change: the Codex judge uses an OpenRouter provider. The built-in
# judge runs Codex with --ignore-user-config, and Codex ignores
# OPENAI_BASE_URL, so this cannot be set from outside the profile.
#
# The profile keeps the name "clawhub" on purpose: ClawScan applies ClawHub's
# production rules (a partial SkillSpector report reaches the judge, the
# judge's inspection receipt is checked) by profile name. clawhub-scan.yml
# copies prompt.md and output.schema.json next to this file from the same
# ClawScan commit.
version: 1

profiles:
  clawhub:
    scanners:
      - skillspector
      - clawscan-static
      - aig
    scannerEnvDefaults:
      SKILLSPECTOR_PROVIDER: openai
      SKILLSPECTOR_MODEL: gpt-6.1-sol
      SKILLSPECTOR_REASONING_EFFORT: medium
      DEFAULT_MODEL: gpt-6.1-sol
      REASONING_EFFORT: medium
    sandbox:
      env:
        - OPENAI_API_KEY
        - OPENAI_BASE_URL
        - SKILLSPECTOR_PROVIDER
        - SKILLSPECTOR_MODEL
        - SKILLSPECTOR_REASONING_EFFORT
        - LLM_API_KEY
        - DEFAULT_MODEL
        - REASONING_EFFORT
        - DEFAULT_BASE_URL
    judge:
      command: >-
        codex exec --cd {{ workspace }}
        --model gpt-6.1-sol
        --sandbox {{ judge_sandbox }}
        --skip-git-repo-check
        --ignore-user-config
        -c model_provider=openrouter
        -c 'model_providers.openrouter.name="OpenRouter"'
        -c "model_providers.openrouter.base_url=\"$OPENAI_BASE_URL\""
        -c 'model_providers.openrouter.env_key="OPENAI_API_KEY"'
        -c 'model_providers.openrouter.wire_api="responses"'
        -c approval_policy=never
        -c model_reasoning_effort=high
        -c 'service_tier="default"'
        -c 'shell_environment_policy.inherit="core"'
        -c shell_environment_policy.ignore_default_excludes=false
        --output-schema {{ output_schema:output.schema.json }}
        --output-last-message {{ output }}
        --ephemeral
        --json
        - < {{ prompt:prompt.md }}
