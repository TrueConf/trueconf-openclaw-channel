name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: typecheck and test (openclaw ${{ matrix.openclaw }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openclaw: [locked, latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Install latest openclaw
        if: matrix.openclaw == 'latest'
        run: npm install --no-save openclaw@latest

      - run: npx openclaw --version

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
