name: ClawHub scan

# Scans the package with what ClawHub runs on a published version, so a warning
# costs a rerun instead of a release:
#   - ClawHub's static scan (npm run scan:clawhub), the same code as the site;
#   - ClawScan's built-in clawhub profile: SkillSpector, ClawScan static, A.I.G
#     (skipped for plugins) and a Codex judge that reads the whole package and
#     gives the verdict.
# OPENAI_BASE_URL sends the profile's OpenAI calls to OpenRouter, which accepts
# the same model name, with the OPENROUTER_API_KEY secret; each run costs money. The judge's verdict varies between runs: a benign result lowers
# the odds of a "suspicious" badge but does not rule it out.
on:
  push:  # TEMP: testing before merge
    branches: [clawhub-local-scan]
  workflow_dispatch:
    inputs:
      version:
        description: Scan this published npm version instead of the selected branch
        required: false
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAWSCAN_VERSION: 0.3.0
      CLAWSCAN_SHA256: c0f12b92623b72e43add86ebbac6ae70a027411bfba6d337c25e2334e2415c3f
      CLAWSCAN_IMAGE: ghcr.io/openclaw/clawscan-runtime@sha256:90e573e9c5193fc817002ac0db4e95068d188465f3b4349ba66f8e47931ad087
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Pack the package
        id: pack
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            TARBALL=$(npm pack "$(node -p 'require("./package.json").name')@$VERSION" | tail -n 1)
          else
            npm run build
            TARBALL=$(npm pack | tail -n 1)
          fi
          mkdir pkg
          tar -xzf "$TARBALL" -C pkg
          echo "tarball=$PWD/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: ClawHub static scan
        id: static
        continue-on-error: true
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run scan:clawhub -- "$TARBALL"

      - name: Install ClawScan
        run: |
          curl -fsSLo clawscan.tar.gz "https://github.com/openclaw/clawscan/releases/download/v$CLAWSCAN_VERSION/clawscan_v${CLAWSCAN_VERSION}_linux_amd64.tar.gz"
          echo "$CLAWSCAN_SHA256  clawscan.tar.gz" | sha256sum -c -
          tar -xzf clawscan.tar.gz
          mv "clawscan_v${CLAWSCAN_VERSION}_linux_amd64/clawscan" "$RUNNER_TEMP/clawscan"

      # The clawhub profile accepts SkillSpector's exit 1 (issues found or a
      # partial report) and passes its report to the judge; a project profile
      # would count it as a failure.
      - name: Run ClawScan
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
        run: |
          "$RUNNER_TEMP/clawscan" pkg/package --profile clawhub             --sandbox-env OPENAI_BASE_URL             --sandbox-image "$CLAWSCAN_IMAGE"             --output clawscan-results/artifact.json

      - name: Summarize
        id: verdict
        if: always()
        continue-on-error: true
        run: node .github/clawscan/summarize.mjs clawscan-results/artifact.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clawscan-results
          path: clawscan-results/
          if-no-files-found: ignore

      - name: Check results
        env:
          STATIC: ${{ steps.static.outcome }}
          VERDICT: ${{ steps.verdict.outcome }}
        run: |
          echo "ClawHub static scan: $STATIC"
          echo "ClawScan verdict: $VERDICT (see the run summary)"
          [ "$STATIC" = success ] && [ "$VERDICT" = success ]
